[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cite"
version = "0.1.0"
description = "Agentic/Corrective RAG — LangGraph + Chroma"
requires-python = ">=3.10"
dependencies = [
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "langchain",
  "langchain-groq",
  "chromadb",
  "python-dotenv",
]

[project.optional-dependencies]
hf = [
  "sentence-transformers",
  "langchain-huggingface",
  "langchain-chroma",
]


[project.scripts]
cite = "cite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cite"]
